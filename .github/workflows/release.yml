name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Release APK
        run: |
          cd apps/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK Artifact
        run: |
          mkdir -p release-android
          if [ -f "apps/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp apps/android/app/build/outputs/apk/release/app-release.apk release-android/VEXYRON-Android.apk
          elif [ -f "apps/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp apps/android/app/build/outputs/apk/debug/app-debug.apk release-android/VEXYRON-Android.apk
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEXYRON-Android
          path: release-android/VEXYRON-Android.apk

  build-desktop-linux:
    name: Build Desktop (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Desktop Frontend
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Build Desktop Release Binary
        run: |
          cargo build --release --bin desktop

      - name: Build Tauri Desktop Packages (.deb and .AppImage)
        run: |
          cd apps/desktop
          npx tauri build --bundles deb,appimage --ignore-version-mismatches || npx tauri build --bundles deb --ignore-version-mismatches
          mkdir -p ../../release-desktop/dist
          DEB_FILE=$(ls -t ../../target/release/bundle/deb/*.deb 2>/dev/null | head -n 1)
          APPIMAGE_FILE=$(ls -t ../../target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1)
          if [ -n "$DEB_FILE" ]; then
            cp "$DEB_FILE" ../../release-desktop/dist/VEXYRON-Linux.deb
          fi
          if [ -n "$APPIMAGE_FILE" ]; then
            cp "$APPIMAGE_FILE" ../../release-desktop/dist/VEXYRON-Linux.AppImage
          fi

      - name: Package Standalone Tarball for Linux
        run: |
          mkdir -p release-desktop/vexyron-desktop
          cp target/release/desktop release-desktop/vexyron-desktop/vexyron
          cp launch-desktop.sh release-desktop/vexyron-desktop/
          cp install-desktop.sh release-desktop/vexyron-desktop/
          cp vexyron.desktop release-desktop/vexyron-desktop/
          cp aetherlink-app-icon.png release-desktop/vexyron-desktop/icon.png
          chmod +x release-desktop/vexyron-desktop/vexyron release-desktop/vexyron-desktop/launch-desktop.sh release-desktop/vexyron-desktop/install-desktop.sh
          tar -czvf release-desktop/dist/VEXYRON-Linux-x86_64.tar.gz -C release-desktop vexyron-desktop

      - name: Upload Desktop Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VEXYRON-Desktop-Linux
          path: release-desktop/dist/*

  build-desktop-windows:
    name: Build Desktop (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Desktop Frontend
        shell: bash
        run: |
          cd apps/desktop
          npm ci
          npm run build

      - name: Build Desktop Release Binary
        run: cargo build --release --bin desktop

      - name: Build Tauri Windows Installer (.exe)
        shell: bash
        run: |
          cd apps/desktop
          npx tauri build --bundles nsis --ignore-version-mismatches
          mkdir -p ../../release-windows/dist
          EXE_FILE=$(ls -t ../../target/release/bundle/nsis/*setup*.exe 2>/dev/null | head -n 1)
          if [ -n "$EXE_FILE" ]; then
            cp "$EXE_FILE" ../../release-windows/dist/VEXYRON-Windows-Setup.exe
          fi

      - name: Package Standalone Portable Zip for Windows
        shell: bash
        run: |
          mkdir -p release-windows/vexyron-windows
          cp target/release/desktop.exe release-windows/vexyron-windows/VEXYRON.exe
          cp launch-desktop.bat release-windows/vexyron-windows/
          cp launch-desktop.ps1 release-windows/vexyron-windows/
          cp apps/desktop/src-tauri/icons/icon.ico release-windows/vexyron-windows/
          cd release-windows
          7z a dist/VEXYRON-Windows-Portable.zip vexyron-windows/

      - name: Upload Desktop Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VEXYRON-Desktop-Windows
          path: release-windows/dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-desktop-linux, build-desktop-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: VEXYRON-Android
          path: release-assets

      - name: Download Desktop Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VEXYRON-Desktop-Linux
          path: release-assets

      - name: Download Desktop Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: VEXYRON-Desktop-Windows
          path: release-assets

      - name: Determine Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "VEXYRON ${{ steps.vars.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
